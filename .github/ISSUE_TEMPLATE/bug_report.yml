name: Bug report / 回報問題
description: Something doesn't work as expected. 中文或英文都可以。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please don't paste real notes, personal paths, emails or keys. 請不要貼真實筆記、個人路徑、Email 或金鑰。
  - type: textarea
    id: what
    attributes:
      label: What happened? / 發生了什麼事？
      description: Steps to reproduce, and what you expected instead. 怎麼重現，以及原本預期的結果。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: Shown at the bottom left of the app, or `aizbrain --version`.
      placeholder: 0.9.4
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where? / 在哪裡發生？
      options: [Desktop app on Windows, Desktop app on Mac, CLI or hooks, MCP server, Phone]
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: AI tool, if any / 使用的 AI 工具
      placeholder: Claude Code 2.x, Codex, Gemini CLI...
